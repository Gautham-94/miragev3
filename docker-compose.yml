# Multi-container mirage stack: pipeline (capture/detect/track/record + go2rtc), api
# (read-only FastAPI, shares the pipeline's DB/media/config via volumes), frontend
# (nginx + built Angular app, reverse-proxies /api/* to the api service). mock_cameras is
# intentionally NOT included here -- it's a local dev-only synthetic RTSP source, out of
# scope for this stack (see NVR_EXTENSION_MULTI_MODEL_ROUTING.md discussion / user request).
services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    # SharedMemoryFrameManager (mirage/util/shm.py) sizes its per-camera frame ring
    # buffers against available /dev/shm; Docker's 64MB default is nowhere near enough
    # for more than one camera at real resolution/fps. Adjust upward if you add many
    # cameras or run at high resolution -- see calculate_shm_ring_depth.
    shm_size: "2gb"
    # NVIDIA GPU passthrough (Dockerfile.pipeline is now a CUDA image). Requires: the
    # NVIDIA driver installed on the Windows host, and GPU support enabled in Docker
    # Desktop (Settings > Resources > WSL Integration; Docker Desktop's WSL2 backend
    # exposes the GPU to containers automatically once that's on -- no separate
    # nvidia-container-toolkit install needed on Windows, unlike native Linux Docker).
    # If you don't have a GPU or want to run CPU-only, delete this whole `deploy:` block
    # -- the image still works without a GPU, just slower (see Dockerfile.pipeline).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - config:/data/config
      - media:/data/media
      - cache:/data/cache
      - go2rtc-bin:/data/go2rtc-bin
      # Host folder bind mount (not a named volume) so you can drop/swap .onnx and
      # labelmap files directly from Windows Explorer -- point model_path/labelmap_path
      # at e.g. /data/models/best.onnx via the Manage Detectors page. Change the host
      # side (./models) to wherever you keep model files if not alongside this compose
      # file.
      - ./models:/data/models
      # SpeciesNet (optional; config.species_classifier.enabled defaults to False)
      # downloads its model weights via kagglehub on first use, into the container
      # user's default cache dir (~/.cache/kagglehub) -- without this volume that cache
      # is lost (and re-downloaded from Kaggle) every time the container is recreated.
      # Requires outbound internet access from the container on first classification;
      # if the underlying Kaggle dataset ever requires auth, set KAGGLE_USERNAME/
      # KAGGLE_KEY as environment vars on this service (see kagglehub's own docs).
      - speciesnet-cache:/root/.cache/kagglehub
    ports:
      - "1984:1984" # go2rtc API/HTTP (snapshot fallback, direct debugging)
      # go2rtc WebRTC. BOTH protocols are required: ICE does its connectivity checks and
      # carries media over udp, so a tcp-only mapping (the bare "8555:8555" this used to
      # be -- compose defaults to tcp) leaves every WebRTC connection failing to
      # establish, silently demoting the frontend's Live tiles to the MSE tier.
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      # Address the BROWSER can reach go2rtc on, advertised as an ICE candidate (see
      # mirage/go2rtc/config.py's _env_webrtc_candidates). Without it go2rtc offers only
      # its container-internal bridge IP (172.x.x.x), which no browser can route to, so
      # WebRTC never connects. 127.0.0.1 covers a browser on this Docker host; add this
      # machine's LAN IP (comma-separated, e.g. "127.0.0.1:8555,192.168.1.50:8555") to
      # also reach it from phones/other machines on the network.
      MIRAGE_GO2RTC_WEBRTC_CANDIDATES: "127.0.0.1:8555"
    # Keep go2rtc pointed at the PHYSICAL camera while each camera's own configured
    # rtsp_url points at go2rtc's restream (rtsp://127.0.0.1:8554/<camera>) -- ffmpeg's
    # RTSP client could not hold a direct session to this camera for more than a few
    # seconds, while go2rtc's holds it indefinitely, so routing capture/record through
    # go2rtc's restream gives one stable camera connection shared by everything. Without
    # this override mirage would generate go2rtc's stream list FROM the camera's rtsp_url
    # and go2rtc would end up pointing at its own restream (see build_go2rtc_config).
    # The URL is read from CAM1_RTSP_URL in a local .env file (gitignored) rather than
    # inlined here -- it embeds the camera's credentials, and this file is committed.
    # See .env.example. The `:?` form fails the `up` with a clear message instead of
    # silently starting go2rtc with an empty source if the variable isn't set.
    command:
      - "--go2rtc-source"
      - "cam1=${CAM1_RTSP_URL:?set CAM1_RTSP_URL in .env (see .env.example)}"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - config:/data/config
      - media:/data/media
      - cache:/data/cache
      - ./models:/data/models
    depends_on:
      - pipeline
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  config:
  media:
  cache:
  go2rtc-bin:
  speciesnet-cache:
