[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage"
version = "0.1.0"
description = "Frigate-architecture NVR: video capture, motion detection, AI object detection/tracking, recording."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["mirage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
