# Serves the built Angular SPA and reverse-proxies /api/* to the "api" service so the
# frontend's environment.prod.ts (apiBaseUrl: '') same-origin assumption holds inside
# Docker Compose. The "api" hostname below is the docker-compose.yml service name.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket route for live view (mirage/api/routers/live.py's /api/live/{camera}/ws)
    # needs the Upgrade/Connection headers; matched before the general /api/ block since
    # nginx picks the most specific matching location.
    location /api/live/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular emits content-hashed filenames (main-<hash>.js, chunk-<hash>.js, ...), so a
    # given URL's contents can never change -- cache them hard. A new build produces new
    # filenames, which the freshly-fetched index.html points at.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is the ONE file whose URL stays constant while its contents change every
    # deploy -- it's what maps the app to the current hashed bundle names. Serving it from
    # cache without revalidating pins the browser to a previous build's chunks forever
    # (nginx sends no Cache-Control by default, which lets browsers apply heuristic
    # freshness and skip revalidation entirely), so a deployed fix silently never reaches
    # the user and only a manual hard-refresh recovers. must-revalidate keeps the ETag
    # round-trip -- still a 304 when unchanged, so this costs one conditional request.
    # (no `expires -1;` here -- it emits its own Cache-Control, which would duplicate the
    # header below rather than replace it.)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Angular client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
