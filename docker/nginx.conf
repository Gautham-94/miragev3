# Serves the built Angular SPA and reverse-proxies /api/* to the "api" service so the
# frontend's environment.prod.ts (apiBaseUrl: '') same-origin assumption holds inside
# Docker Compose. The "api" hostname below is the docker-compose.yml service name.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket route for live view (mirage/api/routers/live.py's /api/live/{camera}/ws)
    # needs the Upgrade/Connection headers; matched before the general /api/ block since
    # nginx picks the most specific matching location.
    location /api/live/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
