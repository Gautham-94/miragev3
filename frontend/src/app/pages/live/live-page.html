<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Live</h1>
      <p class="page-subtitle">{{ cameras().length }} camera{{ cameras().length === 1 ? '' : 's' }} configured</p>
    </div>
  </div>

  @if (!loading() && cameras().length === 0) {
    <div class="empty-state">
      <span class="eyebrow">no cameras configured</span>
      <p>Add a camera to config/mirage.yaml to see it here.</p>
    </div>
  } @else {
    <div class="camera-grid">
      @for (camera of cameras(); track camera.name) {
        <app-camera-tile [camera]="camera" />
      }
    </div>
  }
</div>
