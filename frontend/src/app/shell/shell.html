<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">mirage</span>
    </div>

    <nav class="nav">
      @for (item of navItems; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
        >
          <app-icon [name]="item.icon" [size]="17" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <a class="add-camera-btn" routerLink="/add-camera" routerLinkActive="active">
      <app-icon name="plus" [size]="16" />
      <span>Add camera</span>
    </a>

    <div class="sidebar-footer">
      <span class="eyebrow">system</span>

      @if (isRestarting()) {
        <div class="status-line restarting">
          <span class="spinner"></span>
          <span class="mono">restarting…</span>
        </div>
      } @else if (showReadyBanner()) {
        <div class="status-line ready">
          <app-icon name="checkCircle" [size]="14" />
          <span class="mono">system ready</span>
        </div>
      } @else if (isCrashed()) {
        <div class="status-line crashed">
          <span class="status-dot crashed"></span>
          <span class="mono">pipeline crashed</span>
        </div>
      } @else {
        <div class="status-line">
          <span class="status-dot"></span>
          <span class="mono">operational</span>
        </div>
      }

      <button
        type="button"
        class="apply-changes-btn"
        [disabled]="isRestarting()"
        (click)="applyChanges()"
      >
        @if (isRestarting()) {
          <span class="spinner small"></span>
          <span>Restarting…</span>
        } @else {
          <app-icon name="clock" [size]="14" />
          <span>Apply changes</span>
        }
      </button>
    </div>
  </aside>

  <div class="main">
    <router-outlet />
  </div>
</div>
